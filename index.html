<script>
const state = {
  tab: "dashboard",
  companyId: "all",
  year: 2026,
  month: "",
  meta: null,
  reportTab: "bs",
  chart: null,
};

const fmtIDR = (v) => {
  const n = Number(v || 0);
  const abs = Math.abs(n);
  const s = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 }).format(abs);
  return n < 0 ? `(Rp ${s})` : `Rp ${s}`;
};

const fmtShort = (v) => {
  const n = Number(v || 0);
  const sign = n < 0 ? "-" : "";
  const a = Math.abs(n);
  if (a >= 1e9) return `${sign}Rp ${(a / 1e9).toFixed(2)} M`;
  if (a >= 1e6) return `${sign}Rp ${(a / 1e6).toFixed(1)} Jt`;
  return fmtIDR(n);
};

function setTitle(title) {
  document.getElementById("page-title").textContent = title;
}

function toast(msg, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-sm font-medium text-white ${isError ? "bg-rose-600" : "bg-emerald-600"}`;
  el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 4000);
}

function openModal(title, html) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = html;
  document.getElementById("modal-backdrop").classList.remove("hidden");
}

function closeModal() {
  document.getElementById("modal-backdrop").classList.add("hidden");
}


// ============================================================================
// In-Browser Enterprise ERP Engine (Standalone Vercel Static Runtime)
// Powered by real verified 2024-2026 GL Snapshot + Live Interactive Mutations
// ============================================================================
const DB = window.__ACCOUNTECH_SNAPSHOT__;
let nextId = 90000;

function parseQuery(urlStr) {
  const u = new URL(urlStr, "http://local");
  const params = {};
  for (const [k, v] of u.searchParams.entries()) params[k] = v;
  return { path: u.pathname, params };
}

function makeCoretaxXml(batchNo, period, invoices) {
  const items = invoices.map((f) => `    <TaxInvoice>
      <TaxInvoiceDate>${f.faktur_date}</TaxInvoiceDate>
      <TransactionCode>${f.trx_code}</TransactionCode>
      <SellerTIN>0134567890120000</SellerTIN>
      <BuyerTIN>${f.buyer_tin}</BuyerTIN>
      <BuyerName>${f.customer_name}</BuyerName>
      <TaxBase>${Math.round(Number(f.dpp))}</TaxBase>
      <OtherTaxBase>${Math.round(Number(f.dpp_other))}</OtherTaxBase>
      <VAT>${Math.round(Number(f.ppn))}</VAT>
      <ListOfGoodService><GoodsService><Name>${f.invoice_no}</Name><TaxBase>${Math.round(Number(f.dpp))}</TaxBase><VAT>${Math.round(Number(f.ppn))}</VAT></GoodsService></ListOfGoodService>
    </TaxInvoice>`).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>\n<TaxInvoiceBatch>\n  <SellerTIN>0134567890120000</SellerTIN>\n  <Period>${period}</Period>\n  <BatchNo>${batchNo}</BatchNo>\n  <ListOfTaxInvoice>\n${items}\n  </ListOfTaxInvoice>\n</TaxInvoiceBatch>`;
}

function downloadXmlString(filename, xmlStr) {
  const blob = new Blob([xmlStr], { type: "application/xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

async function api(url, opts = {}) {
  const method = (opts.method || "GET").toUpperCase();
  const body = opts.body ? JSON.parse(opts.body) : null;
  const { path, params } = parseQuery(url);
  const cidKey = params.company_id || "all";
  const cidNum = cidKey === "all" ? null : Number(cidKey);
  const yr = Number(params.year || 2026);
  const mo = params.month ? Number(params.month) : null;

  const filterBy = (arr, useYear = true) => arr.filter((x) => {
    if (cidNum && x.company_id && x.company_id !== cidNum) return false;
    if (useYear && x.year && x.year !== yr) return false;
    if (mo && x.month && x.month !== mo) return false;
    return true;
  });

  if (path === "/api/meta") return DB.meta;
  if (path === "/api/dashboard") return DB.dashboards[`${cidKey}:${yr}`] || DB.dashboards["all:2026"];
  if (path === "/api/reports/trial-balance") return DB.trial_balances[`${cidKey}:${yr}`];
  if (path === "/api/reports/income-statement") return DB.income_statements[`${cidKey}:${yr}`];
  if (path === "/api/reports/balance-sheet") return DB.balance_sheets[`${cidKey}:${yr}`];
  if (path === "/api/reports/cash-flow") return DB.cash_flows[`${cidKey}:${yr}`];
  if (path === "/api/sales/ar-aging") return DB.ar_agings[cidKey] || DB.ar_agings["all"];
  if (path === "/api/purchases/ap-aging") return DB.ap_agings[cidKey] || DB.ap_agings["all"];

  if (path === "/api/gl/accounts") return DB.accounts[String(params.company_id || 1)] || [];
  if (path === "/api/sales/customers") return DB.customers[String(params.company_id || 1)] || [];
  if (path === "/api/purchases/vendors") return DB.vendors[String(params.company_id || 1)] || [];
  if (path === "/api/inventory/products") return DB.products[String(params.company_id || 1)] || [];
  if (path === "/api/inventory/balances") return DB.stock_balances[String(params.company_id || 1)] || [];

  if (path.startsWith("/api/inventory/kartu-stok/")) {
    const pid = path.split("/").pop();
    const list = DB.kartu_stok[pid] || [];
    return params.warehouse_id ? list.filter((m) => m.warehouse_id === Number(params.warehouse_id)) : list;
  }

  if (path === "/api/sales/invoices" && method === "GET") return filterBy(DB.sales_invoices);
  if (path === "/api/purchases/bills" && method === "GET") return filterBy(DB.vendor_bills);
  if (path === "/api/tax/efaktur") return filterBy(DB.efakturs);
  if (path === "/api/tax/vat-returns") return filterBy(DB.vat_returns);
  if (path === "/api/tax/coretax-batches") return filterBy(DB.coretax_batches, false);
  if (path === "/api/assets") return filterBy(DB.assets, false);
  if (path === "/api/payroll/runs") return filterBy(DB.payroll_runs);
  if (path === "/api/gl/journals" && method === "GET") return filterBy(DB.journals);
  if (path === "/api/audit/logs") return filterBy(DB.audit_logs, false);
  if (path === "/api/audit/verify") return DB.audit_chain;
  if (path === "/api/closing/periods") return DB.periods[`${params.company_id || 1}:${yr}`];
  if (path === "/api/closing/readiness") return DB.readiness[String(params.company_id || 1)];

  if (path === "/api/tax/validate-npwp") {
    const clean = (params.npwp || "").replace(/[\s.\-]/g, "");
    if (!/^\d{16}$/.test(clean)) return { valid: false, error: "NPWP/NIK wajib tepat 16 digit angka (PMK 112/2022)" };
    return {
      valid: true,
      kind: clean.startsWith("0") ? "NPWP16_BADAN" : "NIK_OP",
      formatted: `${clean.slice(0,4)}.${clean.slice(4,8)}.${clean.slice(8,12)}.${clean.slice(12,16)}`,
      nitku_default: clean + "000000",
    };
  }

  // Journal detail
  const mJ = path.match(/^\/api\/gl\/journals\/(\d+)$/);
  if (mJ) {
    const d = DB.journal_details[mJ[1]];
    if (!d) throw new Error("Detail jurnal tidak tersedia pada snapshot");
    return d;
  }

  // Account ledger drill-down (computed from loaded journals)
  if (path.startsWith("/api/gl/ledger/")) {
    const code = path.split("/").pop();
    const accts = DB.accounts[String(params.company_id || 1)] || [];
    const acc = accts.find((a) => a.code === code) || { code, name: code, normal_balance: "D" };
    let running = 0;
    const entries = [];
    Object.values(DB.journal_details).forEach((j) => {
      if (j.status !== "POSTED" || j.year !== yr) return;
      (j.lines || []).forEach((l) => {
        if (l.account_code === code) {
          const dr = Number(l.debit || 0), cr = Number(l.credit || 0);
          running += acc.normal_balance === "D" ? (dr - cr) : (cr - dr);
          entries.push({ journal_no: j.journal_no, entry_date: j.entry_date, description: l.description || j.description, debit: l.debit, credit: l.credit, running_balance: String(running) });
        }
      });
    });
    return { account: acc, opening_balance: "0", closing_balance: String(running), entries };
  }

  // ---------------- LIVE INTERACTIVE MUTATIONS (WITH ZERO-DEFECT VALIDATION) ----------------
  if (path === "/api/gl/journals" && method === "POST") {
    const dt = body.entry_date;
    const [y, m] = dt.split("-").map(Number);
    const pObj = (DB.periods[`${body.company_id}:${y}`]?.periods || []).find((p) => p.month === m);
    if (!pObj || pObj.status !== "OPEN") {
      throw new Error(`Fiscal period ${y}-${String(m).padStart(2, "0")} is CLOSED. Posting/editing is blocked.`);
    }
    const accts = DB.accounts[String(body.company_id)] || [];
    let dr = 0, cr = 0;
    const detLines = body.lines.map((l, idx) => {
      const a = accts.find((x) => x.id === l.account_id);
      if (!a) throw new Error("Akun tidak ditemukan");
      if (a.is_control_account) {
        throw new Error(`Control Account Protection: Account ${a.code} (${a.name}) is a control account and cannot be posted manually via General Journal.`);
      }
      const dVal = Number(l.debit || 0), cVal = Number(l.credit || 0);
      dr += dVal; cr += cVal;
      return { line_no: idx + 1, account_code: a.code, account_name: a.name, description: body.description, debit: String(dVal), credit: String(cVal) };
    });
    if (dr <= 0 || Math.abs(dr - cr) > 0.0001) {
      throw new Error(`Unbalanced journal entry: SUM(debit)=${dr} != SUM(credit)=${cr}`);
    }
    const id = ++nextId;
    const jno = `GJ-${body.company_id}-${y}${String(m).padStart(2, "0")}-${String(id).slice(-4)}`;
    const rec = { id, company_id: body.company_id, year: y, month: m, journal_no: jno, entry_date: dt, journal_type: "GJ", source_module: "GL", description: body.description, total_debit: String(dr), total_credit: String(cr), status: "POSTED", reversed_by_id: null, reversed_journal_id: null };
    DB.journals.unshift(rec);
    DB.journal_details[String(id)] = { ...rec, lines: detLines };
    DB.audit_logs.unshift({ id: ++nextId, company_id: body.company_id, event_time: new Date().toISOString(), username: "sr_acct", role: "SENIOR_ACCOUNTANT", action: "JOURNAL_POSTED", entity_type: "JournalEntry", entity_ref: jno, row_hash: "sha256:live-" + id });
    return rec;
  }

  const mApp = path.match(/^\/api\/gl\/journals\/(\d+)\/approve$/);
  if (mApp && method === "POST") {
    const j = DB.journals.find((x) => x.id === Number(mApp[1]));
    if (!j || j.status !== "DRAFT") throw new Error("Hanya jurnal DRAFT yang dapat di-approve");
    j.status = "POSTED";
    if (DB.journal_details[mApp[1]]) DB.journal_details[mApp[1]].status = "POSTED";
    const r = DB.readiness[String(j.company_id)];
    if (r && r.unposted_drafts > 0) {
      r.unposted_drafts -= 1;
      if (r.unposted_drafts === 0 && r.status === "OPEN") r.can_close = true;
    }
    return j;
  }

  const mRev = path.match(/^\/api\/gl\/journals\/(\d+)\/reverse$/);
  if (mRev && method === "POST") {
    const orig = DB.journal_details[mRev[1]];
    if (!orig || orig.status !== "POSTED") throw new Error("Hanya jurnal POSTED yang bisa dibalik");
    const id = ++nextId;
    const rno = `RV-${orig.company_id}-202611-${String(id).slice(-4)}`;
    const rev = { ...orig, id, journal_no: rno, entry_date: body.reversal_date, journal_type: "RV", description: `Reversal ${orig.journal_no} - ${body.reason}`, reversed_journal_id: orig.id, reversed_by_id: null };
    orig.reversed_by_id = id;
    const origRow = DB.journals.find((x) => x.id === orig.id);
    if (origRow) origRow.reversed_by_id = id;
    DB.journals.unshift(rev);
    DB.journal_details[String(id)] = { ...rev, lines: orig.lines.map((l) => ({ ...l, debit: l.credit, credit: l.debit })) };
    return { reversal_id: id, reversal_no: rno };
  }

  if (path === "/api/sales/invoices" && method === "POST") {
    const cust = (DB.customers[String(body.company_id)] || []).find((c) => c.id === body.customer_id);
    const prod = (DB.products[String(body.company_id)] || []).find((p) => p.id === body.product_id);
    const dpp = Number(prod.sale_price) * Number(body.qty);
    const ppn = Math.round(dpp * 0.11);
    const tot = dpp + ppn;
    const id = ++nextId;
    const doc_no = `INV-${body.company_id}-202611-${String(id).slice(-4)}`;
    DB.sales_invoices.unshift({ id, company_id: body.company_id, year: 2026, month: 11, doc_no, doc_date: body.doc_date, due_date: "2026-12-20", customer_name: cust.name, trx_code: "04", currency: "IDR", dpp: String(dpp), ppn: String(ppn), total: String(tot), total_idr: String(tot), balance_due: String(tot), status: "POSTED", journal_id: null });
    DB.efakturs.unshift({ id: ++nextId, company_id: body.company_id, year: 2026, month: 11, invoice_no: doc_no, faktur_no: "(Pending Coretax)", faktur_date: body.doc_date, customer_name: cust.name, buyer_tin: cust.npwp, trx_code: "04", dpp: String(dpp), dpp_other: String(Math.round(dpp * 11 / 12)), ppn_rate: "12.0000", ppn: String(ppn), status: "READY_TO_EXPORT" });
    return { id, doc_no, total_idr: String(tot) };
  }

  if (path === "/api/sales/receipts" && method === "POST") {
    const inv = DB.sales_invoices.find((i) => i.id === body.invoice_id);
    if (inv) {
      inv.balance_due = String(Math.max(0, Number(inv.balance_due) - Number(body.amount_applied)));
      inv.status = Number(inv.balance_due) === 0 ? "PAID" : "PARTIAL";
    }
    return { id: ++nextId, doc_no: `RCV-${body.company_id}-202611-${String(nextId).slice(-4)}` };
  }

  if (path === "/api/purchases/bills" && method === "POST") {
    const vend = (DB.vendors[String(body.company_id)] || []).find((v) => v.id === body.vendor_id);
    const sub = Number(body.unit_price);
    const ppn = Math.round(sub * 0.11);
    const id = ++nextId;
    const doc_no = `BILL-${body.company_id}-202611-${String(id).slice(-4)}`;
    DB.vendor_bills.unshift({ id, company_id: body.company_id, year: 2026, month: 11, doc_no, doc_date: body.doc_date, due_date: "2026-12-20", vendor_name: vend.name, currency: "IDR", subtotal: String(sub), ppn: String(ppn), pph_type: vend.pph_type, pph_amount: "0", total: String(sub + ppn), balance_due: String(sub + ppn), status: "POSTED", journal_id: null });
    return { id, doc_no, total_idr: String(sub + ppn) };
  }

  if (path === "/api/purchases/payments" && method === "POST") {
    const vb = DB.vendor_bills.find((b) => b.id === body.bill_id);
    if (vb) { vb.balance_due = "0"; vb.status = "PAID"; }
    return { id: ++nextId, doc_no: `PAY-${body.company_id}-202611-${String(nextId).slice(-4)}` };
  }

  if (path === "/api/inventory/opname" && method === "POST") {
    const list = DB.stock_balances[String(body.company_id)] || [];
    const sb = list.find((x) => x.product_id === body.product_id && x.warehouse_id === body.warehouse_id);
    if (sb) {
      sb.qty_on_hand = String(body.counted_qty);
      sb.stock_value = String(Number(body.counted_qty) * Number(sb.avg_cost));
    }
    return { id: ++nextId, doc_no: `OPN-${body.company_id}-202611-${String(nextId).slice(-4)}` };
  }

  if (path === "/api/assets/depreciate" && method === "POST") {
    const r = DB.readiness[String(params.company_id || 1)];
    if (r) { r.depreciation_done = true; r.depreciation_amount = "62750000"; }
    return { id: ++nextId, total_commercial: "62750000" };
  }

  if (path === "/api/payroll/run" && method === "POST") {
    return { id: ++nextId, total_pph21: "26450000", total_net_pay: "218500000" };
  }

  if (path === "/api/closing/fx-reval" && method === "POST") {
    const r = DB.readiness[String(params.company_id || 1)];
    if (r) { r.fx_reval_done = true; r.fx_net = "10500000"; }
    return { id: ++nextId, closing_rate: "16340", net_gain_loss: "10500000" };
  }

  if (path === "/api/closing/close-month" && method === "POST") {
    const cid = String(params.company_id || 1);
    const r = DB.readiness[cid];
    if (r.unposted_drafts > 0) throw new Error("Masih ada jurnal DRAFT yang belum di-approve!");
    r.status = "CLOSED"; r.can_close = false; r.depreciation_done = true; r.fx_reval_done = true;
    const p = (DB.periods[`${cid}:2026`]?.periods || []).find((x) => x.month === 11);
    if (p) p.status = "CLOSED";
    return { year: 2026, month: 11, status: "CLOSED" };
  }

  if (path === "/api/tax/vat-netting" && method === "POST") {
    return { id: ++nextId, net_payable: "148200000", overpaid_cf: "0", status: "NETTED" };
  }

  if (path === "/api/tax/coretax-export" && method === "POST") {
    const cid = Number(params.company_id || 1);
    const eligible = DB.efakturs.filter((f) => f.company_id === cid && f.year === 2026 && f.month === 11);
    const id = ++nextId;
    const bno = `CTX-${cid}-202611-${String(id).slice(-4)}`;
    const totDpp = eligible.reduce((s, f) => s + Number(f.dpp), 0);
    const totPpn = eligible.reduce((s, f) => s + Number(f.ppn), 0);
    const xml = makeCoretaxXml(bno, "2026-11", eligible);
    DB.coretax_batches.unshift({ id, company_id: cid, batch_no: bno, period: "2026-11", invoice_count: eligible.length, total_dpp: String(totDpp), total_ppn: String(totPpn), exported_at: new Date().toISOString(), xml_content: xml });
    eligible.forEach((f) => { if (f.status === "READY_TO_EXPORT") f.status = "EXPORTED"; });
    return { id, batch_no: bno, invoice_count: eligible.length };
  }

  throw new Error(`Endpoint tidak ditemukan: ${path}`);
}

// Intercept Coretax XML download links for client-side download
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href*='/api/tax/coretax-batches/']");
  if (!a) return;
  e.preventDefault();
  const m = a.getAttribute("href").match(/coretax-batches\/(\d+)\/xml/);
  if (!m) return;
  const b = DB.coretax_batches.find((x) => x.id === Number(m[1]));
  if (b && b.xml_content) downloadXmlString(`${b.batch_no}.xml`, b.xml_content);
});

function qs(extra = {}) {
  const p = new URLSearchParams();
  if (state.companyId && state.companyId !== "all") p.set("company_id", state.companyId);
  p.set("year", state.year);
  if (state.month) p.set("month", state.month);
  Object.entries(extra).forEach(([k, v]) => {
    if (v !== undefined && v !== null && v !== "") p.set(k, v);
  });
  return p.toString();
}

function activeCompanyNum() {
  return state.companyId === "all" ? 1 : Number(state.companyId);
}

function badge(status) {
  const map = {
    POSTED: "bg-emerald-50 text-emerald-700 border-emerald-200/80",
    PAID: "bg-emerald-50 text-emerald-700 border-emerald-200/80",
    APPROVED: "bg-emerald-50 text-emerald-700 border-emerald-200/80",
    CLOSED: "bg-slate-100 text-slate-600 border-slate-200",
    OPEN: "bg-sky-50 text-sky-700 border-sky-200/80",
    DRAFT: "bg-amber-50 text-amber-700 border-amber-200/80",
    PARTIAL: "bg-amber-50 text-amber-700 border-amber-200/80",
    READY_TO_EXPORT: "bg-indigo-50 text-indigo-700 border-indigo-200/80",
    EXPORTED: "bg-blue-50 text-blue-700 border-blue-200/80",
    NETTED: "bg-amber-50 text-amber-700 border-amber-200/80",
    COMPENSATED: "bg-teal-50 text-teal-700 border-teal-200/80",
  };
  return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${map[status] || "bg-slate-50 text-slate-600 border-slate-200"}">${status}</span>`;
}

async function init() {
  state.meta = await api("/api/meta");
  const sel = document.getElementById("filter-company");
  state.meta.companies.forEach((c) => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = `${c.code} — ${c.name}`;
    sel.appendChild(opt);
  });

  document.getElementById("filter-company").addEventListener("change", (e) => {
    state.companyId = e.target.value;
    render();
  });
  document.getElementById("filter-year").addEventListener("change", (e) => {
    state.year = Number(e.target.value);
    render();
  });
  document.getElementById("filter-month").addEventListener("change", (e) => {
    state.month = e.target.value;
    render();
  });

  document.querySelectorAll("#sidebar-nav .nav-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#sidebar-nav .nav-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state.tab = btn.dataset.tab;
      render();
    });
  });

  render();
}

async function render() {
  const main = document.getElementById("app-content");
  main.innerHTML = `<div class="card p-12 text-center text-slate-400 text-sm">Memuat data akuntansi...</div>`;
  try {
    const handlers = {
      dashboard: renderDashboard,
      sales: renderSales,
      purchases: renderPurchases,
      inventory: renderInventory,
      assets: renderAssets,
      gl: renderGL,
      tax: renderTax,
      reports: renderReports,
      closing: renderClosing,
    };
    await handlers[state.tab](main);
  } catch (err) {
    main.innerHTML = `<div class="bg-rose-50 border border-rose-200 text-rose-800 p-5 rounded-2xl text-sm font-medium">${err.message}</div>`;
  }
}

function goTab(tab) {
  state.tab = tab;
  document.querySelectorAll("#sidebar-nav .nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  render();
}

  e.preventDefault();
  try {
    const res = await api("/api/sales/invoices", {
      method: "POST",
      body: JSON.stringify({
        company_id: activeCompanyNum(),
        customer_id: Number(document.getElementById("si-cust").value),
        doc_date: document.getElementById("si-date").value,
        product_id: Number(document.getElementById("si-prod").value),
        qty: document.getElementById("si-qty").value,
      }),

function showCreateJournalModal() {
  const opts = window._accts.map((a) => `<option value="${a.id}">${a.code} — ${a.name}${a.is_control_account ? " [CONTROL]" : ""}</option>`).join("");
  openModal("Buat Jurnal Umum Multi-Baris", `
    <form onsubmit="submitJournal(event)" class="space-y-4">
      <div class="grid grid-cols-3 gap-3">
        <div><label class="text-xs font-semibold text-slate-600">Tanggal</label><input id="je-date" type="date" value="2026-11-20" class="w-full border border-slate-200 rounded-xl px-3 py-2 mt-1" required /></div>
        <div class="col-span-2"><label class="text-xs font-semibold text-slate-600">Deskripsi</label><input id="je-desc" type="text" placeholder="Penyesuaian beban operasional" class="w-full border border-slate-200 rounded-xl px-3 py-2 mt-1" required /></div>
      </div>
      <div id="je-lines" class="space-y-2">
        ${[0, 1].map(() => `
          <div class="grid grid-cols-12 gap-2 je-row">
            <select class="col-span-6 border border-slate-200 rounded-xl px-2.5 py-2 text-xs je-acc">${opts}</select>
            <input type="number" placeholder="Debit" value="0" class="col-span-3 border border-slate-200 rounded-xl px-2.5 py-2 text-xs je-dr" />
            <input type="number" placeholder="Kredit" value="0" class="col-span-3 border border-slate-200 rounded-xl px-2.5 py-2 text-xs je-cr" />
          </div>`).join("")}
      </div>
      <div class="flex justify-between items-center pt-2">
        <button type="button" onclick="addJournalRow()" class="text-xs text-brand-600 font-semibold hover:underline">+ Tambah Baris</button>
        <div class="space-x-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-xl">Batal</button>
          <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-semibold">Post Jurnal</button>
        </div>
      </div>
    </form>
  `);
  window._jeOpts = opts;
}

function addJournalRow() {
  const div = document.createElement("div");
  div.className = "grid grid-cols-12 gap-2 je-row";
  div.innerHTML = `<select class="col-span-6 border border-slate-200 rounded-xl px-2.5 py-2 text-xs je-acc">${window._jeOpts}</select><input type="number" placeholder="Debit" value="0" class="col-span-3 border border-slate-200 rounded-xl px-2.5 py-2 text-xs je-dr" /><input type="number" placeholder="Kredit" value="0" class="col-span-3 border border-slate-200 rounded-xl px-2.5 py-2 text-xs je-cr" />`;
  document.getElementById("je-lines").appendChild(div);
}

async function submitJournal(e) {
  e.preventDefault();
  const lines = [...document.querySelectorAll(".je-row")].map((r) => ({
    account_id: Number(r.querySelector(".je-acc").value),
    debit: r.querySelector(".je-dr").value || "0",
    credit: r.querySelector(".je-cr").value || "0",
  }));
  try {
    const res = await api("/api/gl/journals", {
      method: "POST",
      body: JSON.stringify({
        company_id: activeCompanyNum(),
        entry_date: document.getElementById("je-date").value,
        description: document.getElementById("je-desc").value,
        lines,
      }),
    });
    closeModal();
    toast(`Jurnal ${res.journal_no} berhasil diposting!`);
    render();
  } catch (err) { toast(err.message, true); }
}

async function approveJournal(id) {
  try {
    const r = await api(`/api/gl/journals/${id}/approve`, { method: "POST" });
    toast(`Jurnal ${r.journal_no} disetujui & diposting!`);
    render();
  } catch (err) { toast(err.message, true); }
}

async function reverseJournalPrompt(id, no) {
  const reason = prompt(`Alasan pembalikan (Reversal) jurnal ${no}:`, "Koreksi pembukuan");
  if (!reason) return;
  try {
    const r = await api(`/api/gl/journals/${id}/reverse`, {
      method: "POST",
      body: JSON.stringify({ reversal_date: "2026-11-20", reason }),
    });
    toast(`Jurnal Pembalik ${r.reversal_no} berhasil dibuat!`);
    render();
  } catch (err) { toast(err.message, true); }
}

          <div class="flex justify-between py-3.5 mt-3 border-t-2 border-slate-900 font-display font-bold text-base"><span>TOTAL LIABILITAS & EKUITAS</span><span class="num">${fmtIDR(bs.total_liabilities_and_equity)}</span></div>
        </div>
      </div>
    `;
  } else if (state.reportTab === "is") {
    const c = is.current;
    bodyHtml = `
      ${is.yoy ? `<div class="p-4 rounded-2xl bg-brand-50/70 border border-brand-200/70 text-brand-900 text-sm flex justify-between"><span>Perbandingan YoY vs FY ${is.yoy.prev_year}: Revenue <b>${is.yoy.revenue_growth_pct}%</b> · Net Income <b>${is.yoy.net_income_growth_pct}%</b></span><span class="font-medium">Prev Rev: ${fmtShort(is.yoy.prev_revenue)}</span></div>` : ""}
      <div class="card p-6 space-y-2 text-sm">
        <h3 class="font-display font-bold text-base text-slate-900 mb-3">Laporan Laba Rugi (${c.start_date} s/d ${c.end_date})</h3>
        ${c.sections.REVENUE.map((r) => `<div class="flex justify-between py-1.5"><span><code class="text-xs text-slate-400 mr-1.5">${r.code}</code>${r.name}</span><span class="num">${fmtIDR(r.amount)}</span></div>`).join("")}
        <div class="flex justify-between py-2.5 border-t border-slate-200 font-bold"><span>Total Pendapatan Usaha</span><span class="num">${fmtIDR(c.revenue)}</span></div>
        ${c.sections.COGS.map((r) => `<div class="flex justify-between py-1.5 text-slate-600"><span><code class="text-xs text-slate-400 mr-1.5">${r.code}</code>${r.name}</span><span class="num">(${fmtIDR(r.amount)})</span></div>`).join("")}
        <div class="flex justify-between py-2.5 border-t border-slate-200 font-bold text-brand-700"><span>Laba Kotor (Gross Profit)</span><span class="num">${fmtIDR(c.gross_profit)}</span></div>
        ${c.sections.EXPENSE.map((r) => `<div class="flex justify-between py-1.5 text-slate-600"><span><code class="text-xs text-slate-400 mr-1.5">${r.code}</code>${r.name}</span><span class="num">(${fmtIDR(r.amount)})</span></div>`).join("")}
        <div class="flex justify-between py-2.5 border-t border-slate-200 font-bold"><span>Laba Usaha (Operating Profit)</span><span class="num">${fmtIDR(c.operating_profit)}</span></div>
        <div class="flex justify-between py-1.5 text-slate-600"><span>Pendapatan Lain-lain (Net)</span><span class="num">${fmtIDR(Number(c.other_income) - Number(c.other_expense))}</span></div>
        <div class="flex justify-between py-1.5 text-slate-600"><span>Beban Pajak Penghasilan (PPh Badan)</span><span class="num">(${fmtIDR(c.tax_expense)})</span></div>
        <div class="flex justify-between py-3.5 border-t-2 border-slate-900 font-display font-bold text-base text-emerald-700"><span>LABA BERSIH (NET INCOME)</span><span class="num">${fmtIDR(c.net_income)}</span></div>
      </div>
    `;
  } else if (state.reportTab === "tb") {
    bodyHtml = `
      <div class="card overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center"><h3 class="font-display font-bold">Neraca Saldo (Trial Balance) per ${tb.as_of}</h3><span class="text-xs font-semibold ${tb.is_balanced ? "text-emerald-600" : "text-rose-600"}">${tb.is_balanced ? "✓ Balanced" : "✗ Imbalanced"}</span></div>
        <table class="w-full text-sm">
          <thead class="bg-slate-50/80 text-[11px] uppercase text-slate-500"><tr><th class="px-5 py-2.5 text-left">Kode</th><th class="px-5 py-2.5 text-left">Akun</th><th class="px-5 py-2.5 text-right">Debit</th><th class="px-5 py-2.5 text-right">Kredit</th></tr></thead>
          <tbody class="divide-y divide-slate-100">${tb.rows.map((r) => `<tr><td class="px-5 py-2 font-mono text-xs text-slate-500">${r.code}</td><td class="px-5 py-2">${r.name}</td><td class="px-5 py-2 text-right num">${Number(r.debit) ? fmtIDR(r.debit) : ""}</td><td class="px-5 py-2 text-right num">${Number(r.credit) ? fmtIDR(r.credit) : ""}</td></tr>`).join("")}</tbody>
          <tfoot class="bg-slate-100 font-bold"><tr><td colspan="2" class="px-5 py-3 text-right">TOTAL NERACA SALDO</td><td class="px-5 py-3 text-right num">${fmtIDR(tb.total_debit)}</td><td class="px-5 py-3 text-right num">${fmtIDR(tb.total_credit)}</td></tr></tfoot>
        </table>
      </div>
    `;
  } else {
    bodyHtml = `
      <div class="card p-6 space-y-3 text-sm">
        <h3 class="font-display font-bold text-base">Laporan Arus Kas (${cf.start_date} s/d ${cf.end_date})</h3>
        <div class="flex justify-between py-2 border-b border-slate-100"><span>Arus Kas dari Aktivitas Operasi</span><span class="num font-semibold">${fmtIDR(cf.operating)}</span></div>
        <div class="flex justify-between py-2 border-b border-slate-100"><span>Arus Kas dari Aktivitas Investasi</span><span class="num font-semibold">${fmtIDR(cf.investing)}</span></div>
        <div class="flex justify-between py-2 border-b border-slate-100"><span>Arus Kas dari Aktivitas Pendanaan</span><span class="num font-semibold">${fmtIDR(cf.financing)}</span></div>
        <div class="flex justify-between py-2 border-b border-slate-100"><span>Dampak Perubahan Kurs Valas</span><span class="num font-semibold">${fmtIDR(cf.fx_effect)}</span></div>
        <div class="flex justify-between py-2.5 font-bold"><span>Kenaikan / (Penurunan) Bersih Kas</span><span class="num">${fmtIDR(cf.net_change)}</span></div>
        <div class="flex justify-between py-1.5 text-slate-500"><span>Saldo Kas Awal Periode</span><span class="num">${fmtIDR(cf.beginning_cash)}</span></div>
        <div class="flex justify-between py-3.5 border-t-2 border-slate-900 font-display font-bold text-base text-brand-700"><span>SALDO KAS AKHIR PERIODE</span><span class="num">${fmtIDR(cf.ending_cash)}</span></div>
      </div>
    `;
  }

  el.innerHTML = `
    <div class="flex flex-wrap gap-2">${tabBtn("bs", "Neraca (Balance Sheet)")}${tabBtn("is", "Laba Rugi (Income Statement)")}${tabBtn("tb", "Neraca Saldo (Trial Balance)")}${tabBtn("cf", "Arus Kas (Cash Flow)")}</div>
    ${bodyHtml}
  `;
}

// --------------------------------------------------------------------------- 9. PERIOD CLOSING & AUDIT
async function renderClosing(el) {
  setTitle("Period Closing & Audit Trail");
  const cid = activeCompanyNum();
  const [periods, ready, logs, chain] = await Promise.all([
    api(`/api/closing/periods?company_id=${cid}&year=${state.year}`),
    api(`/api/closing/readiness?company_id=${cid}&year=2026&month=11`),
    api(`/api/audit/logs?${qs({ limit: 50 })}`),
    api(`/api/audit/verify`),
  ]);

  const monthNames = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];

  el.innerHTML = `
    <div class="card p-6 space-y-5">
      <div class="flex flex-wrap justify-between items-center gap-2">
        <div class="flex items-center gap-3">
          <h2 class="font-display font-bold text-slate-900 text-base">Month-End Closing Wizard — November 2026</h2>
          ${badge(ready.status)}
        </div>
        <span class="text-xs text-slate-500 font-medium">Entity #${cid}</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="p-4 rounded-2xl border ${ready.unposted_drafts === 0 ? "bg-emerald-50/60 border-emerald-200/80" : "bg-amber-50/70 border-amber-200/80"} flex flex-col justify-between">
          <div>
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Step 1</div>
            <div class="font-display font-bold text-slate-900 mt-0.5">Verify Drafts</div>
            <div class="text-xs text-slate-600 mt-1">${ready.unposted_drafts} jurnal DRAFT tersisa</div>
          </div>
          <div class="mt-4">
            ${ready.unposted_drafts > 0
              ? `<button onclick="goTab('gl')" class="w-full py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-semibold transition">Review & Approve</button>`
              : `<span class="inline-flex items-center gap-1 text-xs font-semibold text-emerald-700">✓ Semua Draft Clear</span>`}
          </div>
        </div>

        <div class="p-4 rounded-2xl border ${ready.depreciation_done ? "bg-emerald-50/60 border-emerald-200/80" : "bg-slate-50/70 border-slate-200"} flex flex-col justify-between">
          <div>
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Step 2</div>
            <div class="font-display font-bold text-slate-900 mt-0.5">Run Depreciation</div>
            <div class="text-xs text-slate-600 mt-1">${ready.depreciation_done ? `Selesai (${fmtShort(ready.depreciation_amount)})` : "Penyusutan bulanan aset tetap"}</div>
          </div>
          <div class="mt-4">
            ${!ready.depreciation_done
              ? `<button onclick="runDepNow()" class="w-full py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold transition">Run Depreciation</button>`
              : `<span class="inline-flex items-center gap-1 text-xs font-semibold text-emerald-700">✓ Posted to GL</span>`}
          </div>
        </div>

        <div class="p-4 rounded-2xl border ${ready.fx_reval_done ? "bg-emerald-50/60 border-emerald-200/80" : "bg-slate-50/70 border-slate-200"} flex flex-col justify-between">
          <div>
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Step 3</div>
            <div class="font-display font-bold text-slate-900 mt-0.5">FX Revaluation</div>
            <div class="text-xs text-slate-600 mt-1">${ready.fx_reval_done ? `Selesai (${fmtShort(ready.fx_net)})` : "Revaluasi kurs tengah BI (USD)"}</div>
          </div>
          <div class="mt-4">
            ${!ready.fx_reval_done
              ? `<button onclick="runFxNow()" class="w-full py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold transition">Run FX Reval</button>`
              : `<span class="inline-flex items-center gap-1 text-xs font-semibold text-emerald-700">✓ Posted to GL</span>`}
          </div>
        </div>

        <div class="p-4 rounded-2xl border bg-slate-50/70 border-slate-200 flex flex-col justify-between">
          <div>
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Step 4</div>
            <div class="font-display font-bold text-slate-900 mt-0.5">Lock Period</div>
            <div class="text-xs text-slate-600 mt-1">${ready.can_close ? "Semua prasyarat terpenuhi" : "Selesaikan Step 1 terlebih dahulu"}</div>
          </div>
          <div class="mt-4">
            <button onclick="closeNov2026()" ${ready.can_close ? "" : "disabled"} class="w-full py-2 rounded-xl text-xs font-semibold transition ${ready.can_close ? "bg-rose-600 hover:bg-rose-700 text-white" : "bg-slate-200 text-slate-400 cursor-not-allowed"}">Lock Nov 2026</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-display font-bold text-slate-900">Kalender Periode Fiskal FY ${state.year}</h2>
        <div class="flex items-center gap-2 text-xs text-slate-500">Status Tahun Fiskal: ${badge(periods.fiscal_year.status)}</div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3">
        ${periods.periods.map((p) => `
          <div class="p-3.5 rounded-xl border ${p.status === "CLOSED" ? "bg-slate-50/80 border-slate-200/80" : "bg-sky-50/70 border-sky-200"} flex items-center justify-between">
            <span class="font-display font-bold text-sm text-slate-800">${monthNames[p.month - 1]} ${p.year}</span>
            ${badge(p.status)}
          </div>`).join("")}
      </div>
    </div>

    <div class="card overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex flex-wrap justify-between items-center gap-2">
        <h2 class="font-display font-bold text-slate-900">Immutable Audit Trail</h2>
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border ${chain.valid ? "bg-emerald-50 text-emerald-700 border-emerald-200" : "bg-rose-50 text-rose-700 border-rose-200"}">
          <span class="w-1.5 h-1.5 rounded-full ${chain.valid ? "bg-emerald-500" : "bg-rose-500"}"></span>
          ${chain.valid ? `SHA-256 Hash Chain Verified (${chain.checked} records)` : "Hash Chain Tampered!"}
        </span>
      </div>
      <div class="overflow-x-auto max-h-96">
        <table class="w-full text-xs">
          <thead class="bg-slate-50/90 text-slate-500 uppercase tracking-wider sticky top-0">
            <tr><th class="px-5 py-2.5 text-left">Timestamp</th><th class="px-5 py-2.5 text-left">User / Role</th><th class="px-5 py-2.5 text-left">Action</th><th class="px-5 py-2.5 text-left">Entity / Ref</th><th class="px-5 py-2.5 text-left">SHA-256 Hash</th></tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            ${logs.map((l) => `<tr class="hover:bg-slate-50/80"><td class="px-5 py-2.5 font-mono text-slate-500">${l.event_time.replace("T", " ").slice(0, 19)}</td><td class="px-5 py-2.5"><b class="text-slate-800">${l.username}</b> <span class="text-slate-400">(${l.role || "-"})</span></td><td class="px-5 py-2.5 font-semibold text-slate-700">${l.action}</td><td class="px-5 py-2.5 font-mono text-slate-600">${l.entity_ref || l.entity_type || "-"}</td><td class="px-5 py-2.5 font-mono text-slate-400">${l.row_hash}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function runFxNow() {
  try {
    const r = await api(`/api/closing/fx-reval?company_id=${activeCompanyNum()}&year=2026&month=11`, { method: "POST" });
    toast(`FX Revaluation USD @ ${r.closing_rate} selesai (${fmtIDR(r.net_gain_loss)})`);
    render();
  } catch (err) { toast(err.message, true); }
}

async function closeNov2026() {
  if (!confirm("Kunci periode November 2026? Setelah dikunci tidak dapat diposting lagi.")) return;
  try {
    await api(`/api/closing/close-month?company_id=${activeCompanyNum()}&year=2026&month=11`, { method: "POST" });
    toast("Periode November 2026 berhasil dikunci (CLOSED)!");
    render();
  } catch (err) { toast(err.message, true); }
}

window.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>
